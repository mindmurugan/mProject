<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sun &amp; Moon Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="info-group">
        <span class="info-label">Location</span>
        <span class="info-value" id="location-value">Detecting…</span>
        <button id="gps-btn" class="chip-btn" title="Use device GPS">📍 Use GPS</button>
        <button id="manual-btn" class="chip-btn" title="Enter coordinates manually">✏️ Manual</button>
      </div>
      <div class="info-group">
        <span class="info-label">Current Time</span>
        <span class="info-value" id="time-value">--:--:--</span>
        <span class="info-sub" id="tz-value"></span>
      </div>
    </div>

    <div class="manual-panel" id="manual-panel" hidden>
      <label>Latitude <input type="number" id="lat-input" step="0.0001" min="-90" max="90" /></label>
      <label>Longitude <input type="number" id="lon-input" step="0.0001" min="-180" max="180" /></label>
      <button id="manual-apply" class="chip-btn primary">Apply</button>
    </div>

    <div class="datetime-control">
      <label class="slider-label">
        <span>Date</span>
        <input type="date" id="date-input" />
      </label>
      <label class="slider-label slider-time">
        <span>Time of day <em id="slider-time-readout">--:--</em></span>
        <input type="range" id="time-slider" min="0" max="1439" step="1" />
        <span class="slider-hint">Slider to adjust time and date</span>
      </label>
      <button id="now-btn" class="chip-btn primary">Now</button>
    </div>
  </header>

  <main class="panels">
    <section class="panel map-panel">
      <h2>Map</h2>
      <div id="map"></div>
    </section>

    <section class="panel sky-panel">
      <h2>Sky View</h2>
      <svg id="sky-diagram" viewBox="0 0 440 300" preserveAspectRatio="xMidYMid meet"></svg>
    </section>
  </main>

  <section class="details">
    <div class="details-grid">
      <div class="detail-card highlight">
        <span class="detail-title">☀️ Angle of Sun</span>
        <span class="detail-value" id="sun-altitude">--°</span>
        <span class="detail-sub" id="sun-azimuth">Azimuth --°</span>
      </div>
      <div class="detail-card highlight">
        <span class="detail-title">🌙 Angle of Moon</span>
        <span class="detail-value" id="moon-altitude">--°</span>
        <span class="detail-sub" id="moon-azimuth">Azimuth --°</span>
      </div>
      <div class="detail-card">
        <span class="detail-title">Sunrise / Sunset</span>
        <span class="detail-value small"><span id="sunrise">--:--</span> / <span id="sunset">--:--</span></span>
        <span class="detail-sub" id="daylength"></span>
      </div>
      <div class="detail-card">
        <span class="detail-title">Solar Noon</span>
        <span class="detail-value small" id="solar-noon">--:--</span>
        <span class="detail-sub" id="twilight"></span>
      </div>
      <div class="detail-card">
        <span class="detail-title">Moonrise / Moonset</span>
        <span class="detail-value small"><span id="moonrise">--:--</span> / <span id="moonset">--:--</span></span>
        <span class="detail-sub" id="moon-distance"></span>
      </div>
      <div class="detail-card">
        <span class="detail-title">Moon Phase</span>
        <span class="detail-value small" id="moon-phase-name">--</span>
        <span class="detail-sub" id="moon-illumination"></span>
      </div>
    </div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/suncalc/suncalc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
